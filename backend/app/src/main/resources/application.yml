spring:
  application:
    name: lpsoft

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5482/lpsoft}
    username: ${DATABASE_USER:lpsoft}
    password: ${DATABASE_PASSWORD:lpsoft}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/core
    baseline-on-migrate: false
    # Trilha por feature é anexada em runtime (FlywayConfigurationCustomizer).
    # Uma feature contratada depois traz migration de versão anterior à última
    # já aplicada; out-of-order a aplica para frente, sem recriar o banco — é o
    # que permite liberar uma feature a um cliente já no ar (dados preservados).
    # Seguro porque nenhuma migration cruza fronteira de módulo (sem FK
    # cross-módulo; integridade validada na aplicação).
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    io.lpsoft: DEBUG

lpsoft:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-override-in-prod-via-env-min32bytes}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
    issuer: lpsoft
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
